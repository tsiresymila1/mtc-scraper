name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # tag push: build the 3 binaries (bun cross-compiles from linux) and publish them
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: npm run build
      - name: Smoke test (binary must not depend on node_modules or build-machine paths)
        run: |
          chmod +x dist/mtc-scraper-linux-x64
          mv node_modules /tmp/node_modules.hidden
          mkdir /tmp/smoke && cd /tmp/smoke
          for engine in clearcote camoufox; do
            out=$("$GITHUB_WORKSPACE/dist/mtc-scraper-linux-x64" -e "$engine" https://example.com 2>&1 || true)
            echo "== $engine"; echo "$out" | tail -8
            if echo "$out" | grep -qE "Cannot find module|ENOENT|ERR_MODULE_NOT_FOUND"; then
              echo "::error::$engine: the binary reads files that only exist on the build machine"; exit 1
            fi
          done
      - name: Package
        working-directory: dist
        run: |
          for f in mtc-scraper-darwin-arm64 mtc-scraper-linux-x64; do
            chmod +x "$f" && tar -czf "$f.tar.gz" "$f"
          done
          zip mtc-scraper-windows-x64.zip mtc-scraper-windows-x64.exe
          sha256sum *.tar.gz *.zip > SHA256SUMS
          cat SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # the tag script re-creates tags: replace any existing release for this tag
          gh release delete "$TAG" --yes || true
          gh release create "$TAG" dist/*.tar.gz dist/*.zip dist/SHA256SUMS \
            --title "$TAG" --generate-notes --verify-tag
