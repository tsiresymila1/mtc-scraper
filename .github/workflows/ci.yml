name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # tag push: build the 3 binaries (bun cross-compiles from linux) and publish them
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: npm run build
      - name: Package
        working-directory: dist
        run: |
          for f in mtc-scraper-darwin-arm64 mtc-scraper-linux-x64; do
            chmod +x "$f" && tar -czf "$f.tar.gz" "$f"
          done
          zip mtc-scraper-windows-x64.zip mtc-scraper-windows-x64.exe
          sha256sum *.tar.gz *.zip > SHA256SUMS
          cat SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # the tag script re-creates tags: replace any existing release for this tag
          gh release delete "$TAG" --yes || true
          gh release create "$TAG" dist/*.tar.gz dist/*.zip dist/SHA256SUMS \
            --title "$TAG" --generate-notes --verify-tag
